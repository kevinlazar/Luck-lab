name: Update data

on:
  schedule:
    - cron: '30 12 * * *'     # every morning, 5:30 AM Pacific
    - cron: '45 15 * * 0'     # Sunday 8:45 AM Pacific, after early inactives
    - cron: '15 7 * * 1,2,5'  # overnight after Sunday, Monday and Thursday night games
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/core.py
      - name: Save the new data
        run: |
          git config user.name "Luck Lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
